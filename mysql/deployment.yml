apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql-deployment
  namespace: mysql-ns
  labels:
    app: mysql

spec:
  replicas: 2
  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      name: mysql-pod
      namespace: mysql-ns
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql-container
          image: mysql:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
                  
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-configmap
                  key: database
                   
                  
          volumeMounts:
          - name: mysql-volume
            mountPath: /var/lib/mysql #pod path, volume will attach this path

      volumes:    # Attch pv
      - name: mysql-volume
        persistentVolumeClaim:
          claimName: mysql-pvc      


                  
